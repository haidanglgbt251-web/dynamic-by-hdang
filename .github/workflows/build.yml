name: Build HDang Dynamic

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    
    - name: Install Theos
      run: |
        sudo apt update
        sudo apt install -y git make clang ldid perl dpkg wget xz-utils
        git clone --recursive https://github.com/theos/theos.git /opt/theos
        echo "THEOS=/opt/theos" >> $GITHUB_ENV
        echo "PATH=$PATH:/opt/theos/bin" >> $GITHUB_ENV
    
    - name: Download SDK
      run: |
        mkdir -p /opt/theos/sdks
        cd /opt/theos/sdks
        wget https://github.com/theos/sdks/releases/download/14.5/iPhoneOS14.5.sdk.tar.xz
        tar -xf iPhoneOS14.5.sdk.tar.xz
        ls -la
    
    - name: Check files
      run: |
        pwd
        ls -la
        echo "--- Checking Makefile ---"
        cat Makefile
        echo "--- Checking control ---"
        cat control
    
    - name: Build Tweak
      run: |
        export THEOS=/opt/theos
        export PATH=$PATH:/opt/theos/bin
        make clean
        make package
      
    - name: Upload .deb file
      uses: actions/upload-artifact@v4
      with:
        name: HDangDynamic
        path: packages/*.deb
