# Preferences Configuration
preferences:
  bundle_id: "com.hdang.dynamic"
  
  sections:
    - title: "HDang Dynamic Settings"
      
    - title: "General"
      items:
        - type: "switch"
          key: "enabled"
          default: true
          label: "Enable Tweak"
          
        - type: "switch"
          key: "show_on_lockscreen"
          default: true
          label: "Show on Lockscreen"
          
    - title: "Features"
      items:
        - type: "switch"
          key: "music_integration"
          default: true
          label: "Music Controls"
          
        - type: "switch"
          key: "call_integration"
          default: true
          label: "Call Notifications"
          
        - type: "switch"
          key: "battery_integration"
          default: true
          label: "Battery Display"
          
        - type: "switch"
          key: "system_integration"
          default: true
          label: "System Status"
          
    - title: "Appearance"
      items:
        - type: "slider"
          key: "island_width"
          default: 120
          min: 80
          max: 200
          label: "Width"
          
        - type: "slider"
          key: "island_height"
          default: 35
          min: 25
          max: 50
          label: "Height"
          
        - type: "slider"
          key: "corner_radius"
          default: 17.5
          min: 10
          max: 25
          label: "Corner Radius"
          
    - title: "Animations"
      items:
        - type: "switch"
          key: "animations"
          default: true
          label: "Enable Animations"
          
        - type: "switch"
          key: "haptic_feedback"
          default: true
          label: "Haptic Feedback"
          
        - type: "slider"
          key: "auto_collapse_time"
          default: 5
          min: 1
          max: 15
          label: "Auto Collapse (seconds)"
